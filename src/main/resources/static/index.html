<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPrep Academy</title>
</head>
<body>
    <script>
        const token = localStorage.getItem('token');
        if (token) {
            // Need to know role. Let's redirect to check auth
            window.location.href = '/student/dashboard.html'; // Defaulting, checkAuth in specific pages will handle unauthorized
        } else {
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
