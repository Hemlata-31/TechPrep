<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistake Journal - TechPrep Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .mistake-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem;
        }
        .filter-group { display: flex; gap: 0.65rem; flex-wrap: wrap; }
        .filter-group select {
            padding: 0.55rem 0.9rem; border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg-card); color: var(--text-primary); font-size: 0.9rem;
        }
        .mistake-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            padding: 1.35rem; margin-bottom: 1.15rem; box-shadow: var(--shadow);
        }
        .m-opt {
            padding: 0.65rem 0.9rem; border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 0.45rem; font-size: 0.92rem; color: var(--text-primary);
        }
        .m-opt.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); font-weight: 600; }
        .m-opt.wrong { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); font-weight: 600; }
        .m-expl {
            margin-top: 0.85rem; padding: 0.85rem 1rem; border-radius: 8px;
            background: var(--bg-main); border-left: 3px solid #3b82f6;
            font-size: 0.9rem; color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <h2>TechPrep</h2>
            <nav>
                <ul>
                    <li><a href="/student/dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="/student/mistakes.html" class="active"><i class="fas fa-exclamation-circle"></i> Mistake Journal</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <div class="header">
                <div>
                    <h1><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i> Mistake Journal</h1>
                    <p style="color: var(--text-secondary); margin-top: 4px;">Review wrong answers from Practice &amp; Mock Tests, or retry them in an interactive quiz.</p>
                </div>
                <button id="retryModeBtn" class="btn" style="width:auto; padding:0.65rem 1.25rem; display:none;" onclick="toggleRetryMode()">
                    <i class="fas fa-redo"></i> Practice My Mistakes
                </button>
            </div>

            <!-- Review List Mode -->
            <div id="reviewSection">
                <div class="mistake-toolbar">
                    <div class="filter-group">
                        <select id="catFilter"><option value="">All Categories</option></select>
                        <select id="diffFilter">
                            <option value="">All Difficulties</option>
                            <option value="EASY">EASY</option>
                            <option value="MEDIUM">MEDIUM</option>
                            <option value="HARD">HARD</option>
                        </select>
                    </div>
                    <span id="mistakeCountText" style="font-weight:600; color:var(--text-secondary);"></span>
                </div>
                <div id="mistakesList">
                    <p style="color:var(--text-secondary);">Loading your mistakes...</p>
                </div>
            </div>

            <!-- Interactive Retry Mode -->
            <div id="retrySection" style="display:none; max-width:800px; margin:0 auto;">
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                        <span id="retryCounter" class="badge">Question 1 of 1</span>
                        <span id="retryTopicBadge" class="badge badge-outline"></span>
                    </div>
                    <h3 id="retryQuestionText" style="margin-bottom:1.25rem;"></h3>
                    <div id="retryOptions" class="options-grid"></div>
                    <div id="retryFeedback" class="explanation-box" style="display:none;"></div>
                    <div class="nav-controls">
                        <button class="btn btn-outline" onclick="toggleRetryMode()"><i class="fas fa-list"></i> Back to List</button>
                        <button class="btn" id="retryNextBtn" onclick="nextRetryQuestion()" style="width:auto;">Next <i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/student-mistakes.js"></script>
</body>
</html>
